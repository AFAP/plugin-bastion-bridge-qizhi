name: Build & Release putty.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $content = Get-Content -Path version.py -Raw
          # 捕获引号前缀与行尾（可能是 CRLF），只替换版本号本身。
          $pattern = '(?m)^(__version__[ \t]*=[ \t]*")[^"]*("[ \t]*\r?)$'
          if (-not [regex]::IsMatch($content, $pattern)) {
            throw "version.py 中未找到 __version__ 行"
          }
          $updated = [regex]::Replace($content, $pattern, "`${1}$version`${2}")
          Set-Content -Path version.py -Value $updated -Encoding utf8 -NoNewline
          Write-Host "Stamped version.py with $version"

      - name: Run console and redaction tests
        run: python -m unittest discover -s tests -v

      - name: Build putty.exe with PyInstaller
        run: python -m PyInstaller putty.spec --clean --noconfirm

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path dist\putty.exe).Hash.ToLower()
          "$hash  putty.exe" | Out-File -Encoding ascii dist\putty.exe.sha256
          Write-Host "putty.exe SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qizhi-bridge-putty
          path: |
            dist/putty.exe
            dist/putty.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/putty.exe
            dist/putty.exe.sha256
          generate_release_notes: true
