name: Build & Release putty.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Build putty.exe with PyInstaller
        run: python -m PyInstaller putty.spec --clean --noconfirm

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path dist\putty.exe).Hash.ToLower()
          "$hash  putty.exe" | Out-File -Encoding ascii dist\putty.exe.sha256
          Write-Host "putty.exe SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qizhi-bridge-putty
          path: |
            dist/putty.exe
            dist/putty.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/putty.exe
            dist/putty.exe.sha256
          generate_release_notes: true
